<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-fs="std">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FAF8F5">
<title>闪过 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F5; --surface:#FDFBF7; --surface-2:#F4EFE7;
  --line:#E9E3D6; --line-soft:#F1EBE1;
  --ink:#1C1C1E; --ink-2:#4C4C52; --muted:#8E8E93;
  --green:#2F6F5E; --green-deep:#1F4C3F; --green-soft:#E7EFEA; --green-tint:#F1F6F3;
  --pink:#B06367; --pink-deep:#975054; --pink-soft:#F6E8E9;
  --shadow-card:0 18px 38px -20px rgba(31,76,63,.30);
  --shadow-pop:0 24px 48px -22px rgba(31,76,63,.28);
  --scrim:rgba(28,28,30,.32);
  --serif:"Noto Serif SC","Source Han Serif SC","Cambria Math","STIX Two Math","Latin Modern Math","DejaVu Sans",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --fs-front:34px; --fs-back:18px;
}
[data-theme="dark"]{
  --bg:#141816; --surface:#1C211F; --surface-2:#232A27;
  --line:#2E3532; --line-soft:#262D2A;
  --ink:#E9E7E2; --ink-2:#B8B5AE; --muted:#7E8481;
  --green:#6FB39A; --green-deep:#9BD0BC; --green-soft:rgba(111,179,154,.16); --green-tint:rgba(111,179,154,.10);
  --pink:#D98C9A; --pink-deep:#E9AAB4; --pink-soft:rgba(217,140,154,.14);
  --shadow-card:0 18px 38px -20px rgba(0,0,0,.62);
  --shadow-pop:0 24px 48px -22px rgba(0,0,0,.66);
  --scrim:rgba(0,0,0,.55);
}
[data-theme="dark"] .btn--primary{color:#0F1A16}
[data-fs="lg"]{--fs-front:40px;--fs-back:20px}
[data-fs="xl"]{--fs-front:48px;--fs-back:23px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;overflow:hidden;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
svg{display:block}
.serif{font-family:var(--serif)}
.num{font-family:"DM Serif Display",Georgia,serif}
.mono{font-family:var(--mono)}

#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.view{flex:1;display:none;flex-direction:column;min-height:0}
.view.is-active{display:flex}

/* ---------- topbar ---------- */
.topbar{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 6px;
}
.topbar__title{font-family:var(--serif);font-size:17px;font-weight:600}
.topbar__right{display:flex;gap:4px;flex:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font-size:13px;max-width:46vw;
  box-shadow:0 1px 2px rgba(28,28,30,.05);
}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip svg{width:12px;height:12px;color:var(--green);flex:none}
.iconbtn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.iconbtn:active{background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}

/* ---------- study ---------- */
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 20px 6px;min-height:0;touch-action:pan-y}
.card{
  width:min(86vw,420px);height:60dvh;max-height:560px;position:relative;
  perspective:1400px;touch-action:pan-y;will-change:transform;
}
.card__inner{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .42s cubic-bezier(.2,.8,.2,1);
}
.card.is-flipped .card__inner{transform:rotateY(180deg)}
.card.is-moving .card__inner{transition:none}
.card.is-out-left{animation:outL .24s cubic-bezier(.32,.02,.6,1) forwards}
.card.is-out-right{animation:outR .24s cubic-bezier(.32,.02,.6,1) forwards}
.card.is-fly-up{animation:flyUp .5s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes outL{to{transform:translate3d(-118%,0,0) rotate(-14deg);opacity:0}}
@keyframes outR{to{transform:translate3d(118%,0,0) rotate(14deg);opacity:0}}
@keyframes flyUp{40%{transform:translateY(-18%) scale(.97)}100%{transform:translateY(-120%) scale(.86);opacity:0}}
.face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-card);
  display:flex;flex-direction:column;padding:20px 20px 16px;overflow:hidden;
}
.face--back{transform:rotateY(180deg)}
.face__top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none;font-size:12px;color:var(--muted)}
/* 卡内正文是唯一的滚动区：长内容在这里上下滑，纵向手势不再被自研手势劫持。
   居中用子元素的 auto 外边距，而不是在这里 align-items:center ——
   flex 居中遇到溢出内容会上下同时裁切，auto 边距在剩余空间为负时按 0 处理，
   于是短内容仍然居中、长内容从顶部开始可滚。 */
.face__body{
  flex:1;display:flex;flex-direction:column;min-height:0;padding:10px 2px;
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
.face__body>*{flex:none;margin-top:auto;margin-bottom:auto}
.face__body.is-top>*{margin-top:0;margin-bottom:auto}
.front-text{
  font-family:var(--serif);font-weight:600;font-size:var(--fs-front);line-height:1.28;
  text-align:center;letter-spacing:.01em;white-space:pre-wrap;word-break:break-word;width:100%;
}
.back-text{
  font-family:var(--serif);font-size:var(--fs-back);line-height:1.85;color:var(--ink-2);
  white-space:pre-wrap;word-break:break-word;width:100%;text-align:left;
}
.back-text .hl{color:var(--pink-deep);border-bottom:1px solid var(--pink);padding-bottom:1px}
.face__foot{
  flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding-top:12px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--muted);
}
.tag{
  display:inline-flex;align-items:center;height:20px;padding:0 9px;border-radius:999px;
  background:var(--green-soft);color:var(--green-deep);font-size:11px;font-weight:500;
  max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.starbtn{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;padding:2px 0}
.starbtn svg{width:15px;height:15px}
.starbtn.is-on{color:var(--pink)}
.starbtn.pop svg{animation:pop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.45)}100%{transform:scale(1)}}
.footbar{flex:none;padding:6px 20px calc(env(safe-area-inset-bottom) + 12px)}
.bar{height:3px;border-radius:2px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.footbar__row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:7px}
/* 顺序工具条：状态在左，两个按钮在右；放在进度条下方，拇指容易够到 */
.orderbar{display:flex;align-items:center;gap:6px;margin-top:9px}
.orderbar__state{
  flex:1;min-width:0;font-size:11.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.orderbar__state.is-custom{color:var(--green-deep);font-weight:500}
.orderbtn{
  display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;
  border-radius:999px;background:var(--surface);border:1px solid var(--line);
  color:var(--ink-2);font-size:12px;flex:none;touch-action:manipulation;
}
.orderbtn:active{background:var(--surface-2)}
.orderbtn:disabled{opacity:.42;cursor:default}
.orderbtn svg{width:12px;height:12px}
.hint{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 118px);transform:translateX(-50%);
  font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);
  padding:7px 14px;border-radius:999px;width:max-content;max-width:calc(100vw - 32px);text-align:center;line-height:1.5;z-index:40;
  opacity:0;pointer-events:none;transition:opacity .5s;
}
.hint.show{opacity:1}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.scrim.show{opacity:1;pointer-events:auto}
.menu{
  position:fixed;z-index:70;width:222px;max-height:70dvh;overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-pop);
  padding:6px;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .18s,transform .18s;
}
.menu.show{opacity:1;transform:none;pointer-events:auto}
.menu__head{font-size:11px;color:var(--muted);padding:7px 10px 4px;letter-spacing:.06em}
.menu__item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  padding:9px 10px;border-radius:9px;font-size:13.5px;color:var(--ink-2);text-align:left;
}
.menu__item.is-on{background:var(--green-tint);color:var(--green-deep);font-weight:500}
.menu__item .ck{width:14px;height:14px;color:var(--green);flex:none}
.menu__item .n{font-size:11px;color:var(--muted)}
.menu__sep{height:1px;background:var(--line-soft);margin:5px 8px}
.menu__item--accent{color:var(--pink-deep);font-weight:500}
.menu__item svg{width:13px;height:13px}

/* 下拉搜索面板：从顶部滑下来的 sheet，替代原来的星标抽屉 */
.searchsheet{
  position:fixed;left:0;right:0;top:0;height:auto;max-height:min(78dvh,620px);z-index:60;
  background:var(--bg);border-bottom:1px solid var(--line);border-radius:0 0 18px 18px;
  box-shadow:var(--shadow-pop);display:flex;flex-direction:column;
  transform:translateY(-101%);transition:transform .34s cubic-bezier(.32,.72,0,1);
}
.searchsheet.show{transform:none}
.searchsheet__head{flex:none;padding:12px 14px;border-bottom:1px solid var(--line)}
.searchbox{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 6px 0 12px}
.searchbox:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--green-tint)}
.searchbox>svg{width:16px;height:16px;color:var(--muted);flex:none}
.searchbox__input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14.5px;padding:11px 0}
.searchbox__input::placeholder{color:var(--muted)}
.searchsheet__list{flex:0 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
.srow{display:flex;align-items:flex-start;gap:10px;width:100%;padding:11px 16px;border-bottom:1px solid var(--line-soft);text-align:left}
.srow__t{flex:1;min-width:0}
.srow__f{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow__b{display:block;margin-top:2px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow mark{background:var(--green-tint);color:var(--green-deep);border-radius:3px;padding:0 1px}
.srow__g{flex:none;max-width:32%;padding-top:2px;font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal__box{
  width:min(420px,100%);max-height:86dvh;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-pop);
  animation:pop .22s cubic-bezier(.3,1.2,.5,1);
}
.modal__head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;flex:none}
.modal__head b{font-family:var(--serif);font-size:15.5px;font-weight:600}
.modal__body{padding:6px 16px 4px;overflow-y:auto}
.modal__foot{display:flex;gap:8px;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);flex:none}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.input,textarea.input{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  font-size:14px;outline:none;resize:vertical;
}
.input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-tint)}
.btn{height:38px;padding:0 16px;border-radius:999px;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent}
.btn--primary{background:var(--green);color:#fff}
.btn--ghost{background:var(--bg);border-color:var(--line);color:var(--ink-2)}
.btn--danger{background:transparent;border-color:var(--pink);color:var(--pink-deep)}
.btn--block{width:100%}
.btn svg{width:15px;height:15px}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- library ---------- */
/* 卡片库是「固定头部 + 独立滚动列表 + 固定底栏」的三段式布局。
   底栏用 flex:none 锁定高度：一旦允许收缩，它会被压扁到只剩内边距，
   按钮随即被 overflow 裁切，表现为底栏溢出屏幕外。 */
.libhead{flex:none;z-index:6;background:var(--bg)}
.libscroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.libbar{flex:none;display:flex;gap:8px;align-items:center;padding:4px 16px 10px;overflow-x:auto;overflow-y:hidden}
.libbar::-webkit-scrollbar{display:none}
.libchips{display:flex;gap:7px;flex:none}
.cchip{
  display:inline-flex;align-items:center;gap:6px;height:29px;padding:0 12px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);white-space:nowrap;flex:none;
}
.cchip.is-on{background:var(--green);border-color:var(--green);color:#fff}
.cchip.is-picked{background:var(--green-tint);border-color:var(--green);color:var(--green-deep);font-weight:500}
.cchip .x{display:inline-flex;width:13px;height:13px;align-items:center;justify-content:center;border-radius:50%;background:rgba(0,0,0,.08)}
.cchip .x svg{width:9px;height:9px}
.list{padding:0 16px 12px}
.lrow{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.lrow__b{flex:1;min-width:0}
.lrow__f{font-family:var(--serif);font-size:14.5px;line-height:1.5;font-weight:600;word-break:break-word}
/* 卡片库只展示背面摘要的前 4 行：长卡片不再把列表撑得老高，超出部分用省略号收尾。
   用 -webkit-box + line-clamp 而不是 max-height，后者会把第 4 行从中间裁断、且没有省略号。
   全文仍可在「编辑」弹窗里看到。 */
.lrow__k{
  font-size:12px;color:var(--muted);line-height:1.5;margin-top:3px;word-break:break-word;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;
}
.lrow__k.is-empty{opacity:.5}
.lrow__g{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.gtag{
  display:inline-flex;align-items:center;height:19px;padding:0 8px;border-radius:999px;
  background:var(--green-soft);color:var(--green-deep);font-size:10.5px;
}
.gtag.is-none{background:var(--surface-2);color:var(--muted)}
.lrow__act{display:flex;gap:2px;flex:none;margin-top:-2px}
.lrow__act button{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.lrow__act button svg{width:14px;height:14px}
.lrow__act button.is-star{color:var(--pink)}
.lrow__act button:active{background:var(--surface-2)}
.ckbox{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
.ckbox.is-on{background:var(--green);border-color:var(--green)}
.ckbox svg{width:12px;height:12px;color:#fff;opacity:0}
.ckbox.is-on svg{opacity:1}
.libfoot{flex:none;display:flex;gap:8px;padding:10px 16px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line);background:var(--bg)}
.libfoot .btn{flex:1;height:34px;padding:0 10px;font-size:12.5px}
/* 批量操作栏：按钮按内容均分宽度，窄屏下收缩并省略号截断，绝不横向溢出 */
.batchbar{flex:none;display:flex;gap:6px;padding:10px 16px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line);background:var(--bg)}
.batchbar .btn{flex:1 1 auto;min-width:0;height:34px;padding:0 8px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- settings ---------- */
.set{flex:1;min-height:0;overflow-y:auto;padding:0 16px 24px}
.group{margin-bottom:22px}
.group__t{font-size:11px;color:var(--muted);letter-spacing:.08em;margin:0 0 8px 2px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-soft);min-height:48px}
.row:last-child{border-bottom:0}
.row__l{font-size:13.5px;color:var(--ink)}
.row__v{font-size:12.5px;color:var(--muted);text-align:right}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;color:var(--ink-2)}
.seg button.is-on{background:var(--surface);color:var(--green-deep);box-shadow:0 1px 2px rgba(28,28,30,.08);font-weight:500}
.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--green-deep);padding:9px 12px;background:var(--green-tint);border-radius:10px;margin-top:8px}
.status.is-bad{color:var(--pink-deep);background:var(--pink-soft)}
.davpath{font-size:11.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 11px;line-height:1.65;word-break:break-all}
.davpath code{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.davpath b{color:var(--ink-2)}
.status svg{width:13px;height:13px;flex:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.actions:last-child{border-bottom:0}
.actions .btn{flex:1;min-width:96px;height:34px;font-size:12.5px}
.rowfield{display:block;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.rowfield:last-child{border-bottom:0}
.rowfield label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.rowfield .input{background:var(--bg)}

.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translate(-50%,10px);
  background:var(--ink);color:var(--bg);font-size:13px;padding:9px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:90;max-width:82vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{padding:56px 20px;text-align:center;color:var(--muted);font-size:13px}
.deckrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.deckrow:last-child{border-bottom:0}
.deckrow__n{flex:1;font-size:14px}
.deckrow__c{font-size:11.5px;color:var(--muted)}
.deckrow button{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.deckrow button svg{width:14px;height:14px}
.pickrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.pickrow .cchip{height:30px}
</style>
</head>

<script>
(function(){
'use strict';

/* ================= storage ================= */
const KEY='flashcards.v2';
const OLD_KEY='flashcards.v1';
const HINT_KEY='flashcards.hint.v1';
let store=null;
let ui={view:'study',group:'all',index:0,flipped:false,batch:false,sel:new Set(),libGroup:'all'};

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function now(){return Date.now()}
const $=s=>document.querySelector(s);
const el=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hl(s){return esc(s).replace(/「([^」]*)」/g,'<span class="hl">「$1」</span>')}
function toast(msg){const t=el('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700)}
function fmt(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}

/* ================= seed / migrate ================= */
/* 首次打开时的示例数据：只放 3 张卡片，覆盖三个不同类型（古诗文 / 单词 / 公式），
   够看清每个卡组长什么样，又不会淹没用户自己的内容。
   「设置 → 清空全部数据」会把这些示例一并清掉。 */
function seed(){
  const t=now();
  const G=(name)=>({id:uid(),name:name,updatedAt:t});
  const gs={};['古诗文','单词','数理公式'].forEach(n=>gs[n]=G(n));
  const mk=(front,back,star,g)=>({id:uid(),front:front,back:back,starred:!!star,groups:g.map(x=>gs[x].id),createdAt:t,updatedAt:t});
  const cards=[
    mk('劝君更尽一杯酒，西出阳关无故人。','请你再干了这一杯吧，向西出了阳关，就再也见不到老朋友了。',true,['古诗文']),
    mk('abandon','v. 放弃；抛弃；遗弃',false,['单词']),
    mk('a² + b² = c²','勾股定理',false,['数理公式'])
  ];
  return {version:2,cards:cards,groups:Object.values(gs),settings:{theme:'light',fs:'std',group:'all',orders:{},webdav:{url:'',user:'',pass:'',dir:'flashcards'}}};
}
/* 清空内容：只删卡片与卡组，保留外观（主题/字号）与 WebDAV 配置——
   这些是偏好而不是内容，清空卡片时一并重置只会让用户莫名其妙。
   卡片都清掉了，按卡组保存的随机顺序也一并清空。 */
function emptyContent(){
  store.cards=[];
  store.groups=[];
  store.settings.group='all';
  store.settings.orders={};
}
function migrateV1(v1){
  const cards=[],groups=[];
  (v1.decks||[]).forEach(d=>{
    groups.push({id:d.id,name:d.name,updatedAt:d.updatedAt||now()});
    (d.cards||[]).forEach(c=>cards.push({id:c.id,front:c.front,back:c.back,starred:!!c.starred,groups:[d.id],createdAt:c.createdAt||now(),updatedAt:c.updatedAt||now()}));
  });
  const s=v1.settings||{};
  return {version:2,cards:cards,groups:groups,settings:Object.assign({},s,{webdav:s.webdav||{url:'',user:'',pass:'',dir:'flashcards'}})};
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw); if(d&&Array.isArray(d.cards)&&Array.isArray(d.groups)) return d;}
  }catch(e){}
  try{
    const old=localStorage.getItem(OLD_KEY);
    if(old){const v1=JSON.parse(old); const d=migrateV1(v1); save(d); return d;}
  }catch(e){}
  const s=seed(); save(s); return s;
}
function save(data){
  try{localStorage.setItem(KEY,JSON.stringify(data||store));}catch(e){}
}

/* ================= data helpers ================= */
function groups(){return store.groups}
function groupById(id){return store.groups.find(g=>g.id===id)}
function groupName(id){const g=groupById(id);return g?g.name:''}
function cardsOf(gid){
  if(gid==='star') return store.cards.filter(c=>c.starred);
  if(gid==='all') return store.cards.slice();
  return store.cards.filter(c=>c.groups.indexOf(gid)>=0);
}
/* 背诵顺序按「卡组 id / all / star」分别存在 settings.orders。
   这里只做一次重排：先按保存的顺序取，新加入的卡（不在旧 order 里）按默认顺序追加到末尾。
   这样增删卡片后旧顺序不会错乱，也不需要每次写回。 */
function savedOrder(gid){
  const o=store.settings&&store.settings.orders;
  const ids=o&&o[gid];
  return Array.isArray(ids)&&ids.length?ids:null;
}
function orderedCards(gid){
  const base=cardsOf(gid);
  const ids=savedOrder(gid);
  if(!ids) return base;
  const byId=new Map(base.map(c=>[c.id,c]));
  const out=[],seen=new Set();
  ids.forEach(id=>{
    const c=byId.get(id);
    if(c&&!seen.has(id)){seen.add(id);out.push(c);}
  });
  /* 新增卡片 / 后来才加入该卡组的卡片：排在末尾，而不是从列表里消失 */
  base.forEach(c=>{if(!seen.has(c.id))out.push(c);});
  return out;
}
function hasCustomOrder(gid){return !!savedOrder(gid)}
function orderStore(){
  const s=store.settings;
  if(!s.orders||typeof s.orders!=='object'||Array.isArray(s.orders)) s.orders={};
  return s.orders;
}
function groupCount(gid){return cardsOf(gid).length}
function starCards(){return store.cards.filter(c=>c.starred)}
function findCard(id){return store.cards.find(c=>c.id===id)}
function cardGroupNames(c){
  if(!c.groups||!c.groups.length) return [];
  return c.groups.map(groupName).filter(Boolean);
}
function touchCard(c){c.updatedAt=now()}
function touchGroup(g){if(g)g.updatedAt=now()}
function currentLabel(){
  if(ui.group==='star') return '星标';
  if(ui.group==='all') return '全部卡片';
  return groupName(ui.group)||'全部卡片';
}

/* ================= theme ================= */
function applyTheme(){
  const s=store.settings;
  const sysDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme=s.theme==='auto'?(sysDark?'dark':'light'):s.theme;
  document.documentElement.setAttribute('data-theme',theme);
  document.documentElement.setAttribute('data-fs',s.fs||'std');
  document.querySelector('meta[name=theme-color]').setAttribute('content',theme==='dark'?'#141816':'#FAF8F5');
  if(window.Android&&window.Android.setStatusBar){
    try{window.Android.setStatusBar(theme==='dark'?'#141816':'#FAF8F5',theme!=='dark');}catch(e){}
  }
  el('segTheme').querySelectorAll('button').forEach(b=>b.classList.toggle('is-on',b.dataset.v===s.theme));
  el('segFs').querySelectorAll('button').forEach(b=>b.classList.toggle('is-on',b.dataset.v===(s.fs||'std')));
}

/* ================= study view ================= */
const cardEl=el('card'), innerEl=el('cardInner');

function renderStudy(){
  const cards=orderedCards(ui.group);
  if(ui.index>=cards.length) ui.index=Math.max(0,cards.length-1);
  if(ui.index<0) ui.index=0;
  const c=cards[ui.index];
  const label=currentLabel();
  el('deckName').textContent=label;

  if(!c){
    el('faceFront').innerHTML=`<div class="face__top"><span class="tag">${esc(label)}</span><span class="num">0 / 0</span></div>
      <div class="face__body"><p class="front-text" style="color:var(--muted);font-size:20px">暂无卡片</p></div>
      <div class="face__foot"><span></span><span></span></div>`;
    el('faceBack').innerHTML=`<div class="face__top"><span class="tag">答案</span><span class="num">0 / 0</span></div>
      <div class="face__body"></div><div class="face__foot"><span></span><span></span></div>`;
  }else{
    const names=cardGroupNames(c);
    const src=names.length?names.join(' · '):'未分组';
    const num=`${ui.index+1} / ${cards.length}`;
    const starBtn=(on)=>`<button class="starbtn ${on?'is-on':''}" data-star="${c.id}">
          <svg viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.4l6-.8z"/></svg>
        </button>`;
    el('faceFront').innerHTML=`
      <div class="face__top"><span class="tag">${esc(label)}</span><span class="num">${num}</span></div>
      <div class="face__body"><p class="front-text">${esc(c.front||'')}</p></div>
      <div class="face__foot">${starBtn(c.starred)}<span>${esc(src)}</span></div>`;
    el('faceBack').innerHTML=`
      <div class="face__top"><span class="tag">答案</span><span class="num">${num}</span></div>
      <div class="face__body is-top"><p class="back-text">${c.back?hl(c.back):''}</p></div>
      <div class="face__foot">${starBtn(c.starred)}<span>${esc(src)}</span></div>`;
  }
  el('progBar').style.width=cards.length?((ui.index+1)/cards.length*100)+'%':'0%';
  el('footLeft').textContent=cards.length?`${ui.index+1} / ${cards.length}`:'0 / 0';
  el('footRight').textContent=`星标 ${starCards().length}`;
  renderOrderUI(cards);
}

/* 首页顺序工具条的状态：每个卡组独立判断有没有保存过自定义顺序 */
function renderOrderUI(cards){
  const custom=hasCustomOrder(ui.group);
  const state=el('orderState');
  state.textContent=cards.length?(custom?'已打乱':'默认顺序'):'暂无卡片';
  state.classList.toggle('is-custom',custom);
  el('btnShuffle').disabled=cards.length<2;
  el('btnResetOrder').disabled=!custom;
}
function shuffleStudy(){
  const cards=orderedCards(ui.group);
  if(cards.length<2){toast('至少需要两张卡片');return;}
  const before=cards.map(c=>c.id);
  const ids=before.slice();
  for(let i=ids.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=ids[i];ids[i]=ids[j];ids[j]=t;
  }
  /* 洗出来恰好和原来一样时（2 张卡有 50% 概率）强制换一位，保证点了有变化 */
  if(ids.every((id,i)=>id===before[i])) ids.push(ids.shift());
  orderStore()[ui.group]=ids;
  save();
  ui.index=0;ui.flipped=false;cardEl.classList.remove('is-flipped');
  renderStudy();
  toast('已随机打乱 · '+currentLabel());
}
function resetStudyOrder(){
  if(!hasCustomOrder(ui.group)){toast('当前已是默认顺序');return;}
  /* 复位后尽量停在当前这张卡上，只是它回到默认顺序里的位置 */
  const cur=orderedCards(ui.group)[ui.index];
  delete orderStore()[ui.group];
  save();
  const base=cardsOf(ui.group);
  const at=cur?base.findIndex(x=>x.id===cur.id):-1;
  ui.index=at>=0?at:0;
  ui.flipped=false;cardEl.classList.remove('is-flipped');
  renderStudy();
  toast('已恢复默认顺序');
}

function flip(){
  ui.flipped=!ui.flipped;
  cardEl.classList.toggle('is-flipped',ui.flipped);
}
/* 滑出与换卡：单一连续动作，不回弹、不二次动画 */
function goCard(dir,animate){
  const cards=orderedCards(ui.group);
  if(!cards.length) return;
  const next=ui.index+dir;
  if(next<0||next>=cards.length){
    cardEl.classList.remove('is-out-left','is-out-right');
    cardEl.style.transition='transform .3s cubic-bezier(.25,.8,.3,1)';
    cardEl.style.transform='';
    return;
  }
  const commit=()=>{ui.index=next;ui.flipped=false;cardEl.classList.remove('is-flipped');renderStudy();};
  if(animate){
    cardEl.style.opacity='0';
    cardEl.classList.remove('is-out-left','is-out-right');
    void cardEl.offsetWidth;
    cardEl.classList.add(dir>0?'is-out-left':'is-out-right');
    setTimeout(()=>{
      cardEl.classList.remove('is-out-left','is-out-right');
      cardEl.style.transform='';
      cardEl.style.transition='';
      commit();
      cardEl.style.opacity='';
    },235);
  }else commit();
}
function toggleStar(id,force){
  const c=findCard(id); if(!c) return;
  const next=(force!==undefined)?force:!c.starred;
  if(next===c.starred) return;
  c.starred=next;touchCard(c);save();
  renderStudy();
  if(ui.view==='library')renderLib();
}
function starCurrent(){
  const cards=orderedCards(ui.group);const c=cards[ui.index];if(!c) return;
  if(c.starred){toast('已在星标');return;}
  cardEl.classList.add('is-fly-up');
  setTimeout(()=>{toggleStar(c.id,true);},300);
  setTimeout(()=>{
    cardEl.classList.remove('is-fly-up');
    cardEl.style.transition='';
    cardEl.style.transform='';
    renderStudy();
    document.querySelectorAll('.starbtn').forEach(b=>b.classList.add('pop'));
    setTimeout(()=>document.querySelectorAll('.starbtn').forEach(b=>b.classList.remove('pop')),480);
    toast('已加入星标');
  },520);
}

/* ================= group menu ================= */
function openDeckMenu(){
  const chip=el('deckChip');

/* ================= search sheet ================= */
/* 下拉搜索面板：匹配卡片的正面与背面，命中处高亮，点击结果直接跳到该卡片。 */
function matchCards(kw){
  const k=(kw||'').trim().toLowerCase();
  if(!k) return [];
  return store.cards.filter(c=>((c.front||'')+'\n'+(c.back||'')).toLowerCase().indexOf(k)>=0);
}
/* 先在原文里定位下标、再分段转义 —— 直接对转义后的串做 indexOf 会因为
   & < > 被展开成 HTML 实体而下标错位，导致高亮落在错误的位置。 */
function markHit(text,kw){
  const raw=String(text==null?'':text);
  if(!kw) return esc(raw);
  const i=raw.toLowerCase().indexOf(kw.toLowerCase());
  if(i<0) return esc(raw);
  return esc(raw.slice(0,i))+'<mark>'+esc(raw.slice(i,i+kw.length))+'</mark>'+esc(raw.slice(i+kw.length));
}
function renderSearch(){
  const kw=(el('searchInput').value||'').trim();
  const list=kw?matchCards(kw):[];
  el('searchList').innerHTML=kw
    ? (list.length
        ? list.map(c=>`<button class="srow" data-jump="${c.id}">
            <span class="srow__t">
              <span class="srow__f">${markHit(c.front,kw)}</span>
              <span class="srow__b">${markHit(c.back,kw)}</span>
            </span>
            <span class="srow__g">${esc(cardGroupNames(c).join(' · ')||'未分组')}</span>
          </button>`).join('')
        : `<div class="empty">没有匹配「${esc(kw)}」的卡片</div>`)
    : `<div class="empty">输入关键词搜索卡片的正面或背面</div>`;
}
function openSearch(){
  renderSearch();
  el('searchSheet').classList.add('show');
  el('scrim').classList.add('show');
}
function closeSearch(){
  el('searchSheet').classList.remove('show');
  el('searchInput').blur();
  if(!el('deckMenu').classList.contains('show')) el('scrim').classList.remove('show');
}
/* 从搜索结果跳到某张卡片：统一切到「全部卡片」上下文再定位。
   搜索是跨卡组的，若沿用当前卡组上下文，结果与背诵内容会对不上。 */
function jumpToCard(id){
  const c=findCard(id); if(!c) return;
  ui.group='all'; store.settings.group='all';
  ui.index=Math.max(0,orderedCards('all').findIndex(x=>x.id===id));
  ui.flipped=false; cardEl.classList.remove('is-flipped');
  save(); closeSearch(); show('study'); renderStudy();
  toast('已跳转到该卡片');
}

/* ================= gestures ================= */
/* 手势状态机：只有「纵向」与「横向」两种模式。
   纵向：只在视口顶部 1/5 内、且起点不在可滚动的卡内正文上时，才允许下拉唤出搜索；
         其余纵向拖动交给原生滚动（长内容卡片）。
   横向：在卡片上左右滑切卡。
   上滑没有任何手势（星标只保留手动按钮、键盘 S 与菜单入口）。

   ⚠️ 触摸手势必须走 touch 事件，不能只靠 pointer 事件：
   浏览器一旦接管手势（原生滚动 / 系统手势）就会给页面发 pointercancel，
   之后的 pointermove 全部中断 —— 横滑会「划到一半被掐断」，表现为切不了卡。
   touch 事件会一路送到 touchend（touchcancel 才是真取消），而且 non-passive
   的 touchmove 可以 preventDefault，把横向手势从浏览器手里抢回来。
   鼠标 / 触控笔仍然走 pointer 事件，两套输入共用下面同一份状态机。 */
let g=null, lastMoved=0;
const TH={swipeRatio:.28,swipeVel:.5,searchPx:80,tapPx:8};

function scrollBoxAt(target){
  const box=target&&target.closest?target.closest('.face__body'):null;
  if(!box) return null;
  return box.scrollHeight-box.clientHeight>1?box:null;
}

function gestureStart(x,y,target,src){
  if(g) return;
  if(!target||!target.closest) return;
  if(target.closest('button,input,textarea,a,.menu,.modal,.searchsheet,.libfoot,.batchbar,.topbar,.set,.libbar')) return;
  if(ui.view!=='study') return;
  const isCard=cardEl.contains(target);
  /* 起点落在「现在真的能滚」的卡内正文上：纵向一律交给原生滚动，自研手势不抢。 */
  const box=isCard?scrollBoxAt(target):null;
  g={src,x,y,t:performance.now(),mode:null,isCard:isCard,moved:0,
     scroll:box,scrollTop0:box?box.scrollTop:0,scrollMoved:false,
     /* 搜索触发区在按下时就定死。等到 move 再看 clientY 已是当前点，起点信息已经丢了。 */
     fromTop:y<window.innerHeight*0.2};
  if(isCard) cardEl.classList.add('is-moving');
}
function gestureMove(x,y,e){
  if(!g) return;
  const dx=x-g.x, dy=y-g.y;
  g.lastX=x;g.lastY=y;
  g.moved=Math.max(g.moved,Math.hypot(dx,dy));
  /* 原生滚动真的动过 → 本次手势锁定为滚动，之后不再改判成切卡/搜索 */
  if(g.scroll&&Math.abs(g.scroll.scrollTop-g.scrollTop0)>2) g.scrollMoved=true;
  if(!g.mode&&!g.scrollMoved&&g.moved>TH.tapPx){
    if(Math.abs(dy)>Math.abs(dx)*1.2){
      /* 能滚的正文里：纵向不设模式；否则只有「顶部 1/5 起手 + 向下」才进搜索 */
      g.mode=g.scroll?null:((dy>0&&g.fromTop)?'search':null);
    }
    else if(Math.abs(dx)>Math.abs(dy)*1.2) g.mode=g.isCard?'swipe':null;
    else g.mode=null;
  }
  if(g.mode==='swipe'){
    /* touchmove 必须 preventDefault，否则浏览器可能把这段横向拖动当成滚动/回退手势 */
    if(e.cancelable) e.preventDefault();
    cardEl.style.transition='none';
    cardEl.style.transform=`translate3d(${dx}px,0,0) rotate(${dx*0.04}deg)`;
  }else if(g.mode==='search'){
    if(e.cancelable) e.preventDefault();
    const d=el('searchSheet');
    if(!d.classList.contains('show')){d.classList.add('show');el('scrim').classList.add('show');renderSearch();}
    d.style.transition='none';
    d.style.transform=`translateY(${Math.max(0,dy-2)}px)`;
  }
}
function gestureEnd(x,y,canceled){
  if(!g) return;
  /* 被取消时坐标不可靠（pointercancel 常为 0），用最后一次 move 的位置结算 */
  const cx=(canceled&&g.lastX!==undefined)?g.lastX:x;
  const cy=(canceled&&g.lastY!==undefined)?g.lastY:y;
  const dx=cx-g.x, dy=cy-g.y;
  const dt=Math.max(1,performance.now()-g.t);
  const mode=g.mode, moved=g.moved;
  const box=g.scroll, scrollTop0=g.scrollTop0;
  /* 原生滚动动过之后不算轻点，免得滚完手一松就翻面 */
  lastMoved=(box&&Math.abs(box.scrollTop-scrollTop0)>2)?999:moved;
  g=null;
  cardEl.classList.remove('is-moving');
  const d=el('searchSheet');

  if(!mode){
    cardEl.style.transition='transform .3s cubic-bezier(.25,.8,.3,1)';
    cardEl.style.transform='';
    return;
  }
  if(mode==='swipe'){
    const w=cardEl.offsetWidth||1;
    const fast=Math.abs(dx)/dt>TH.swipeVel&&Math.abs(dx)>40;
    /* 被浏览器/系统取消的手势不结算成切卡 */
    if(!canceled&&(Math.abs(dx)>w*TH.swipeRatio||fast)){
      /* 保持当前位移，直接飞出：跟手 → 滑出是同一段动作 */
      cardEl.style.transition='none';
      goCard(dx<0?1:-1,true);
    }else{
      cardEl.style.transition='transform .28s cubic-bezier(.25,.8,.3,1)';
      cardEl.style.transform='';
    }
  }else if(mode==='search'){
    /* 搜索面板只在正常松手时吸附展开：被取消的手势不唤出面板 */
    if(!canceled&&dy>TH.searchPx){
      d.style.transition='transform .34s cubic-bezier(.32,.72,0,1)';
      d.style.transform='translateY(0)';
      setTimeout(()=>{d.style.transition='';d.style.transform='';},360);
      /* 面板落定后再聚焦，键盘弹出更稳 */
      setTimeout(()=>{try{el('searchInput').focus()}catch(e){}},340);
    }else{
      d.style.transition='transform .26s ease';
      d.style.transform='translateY(-101%)';
      setTimeout(()=>{
        d.classList.remove('show');d.style.transition='';d.style.transform='';
        if(!el('deckMenu').classList.contains('show')) el('scrim').classList.remove('show');
      },280);
    }
  }
}

/* ---------- 触摸：touch 事件（主路径） ---------- */
function onTouchStart(e){
  if(e.touches.length!==1) return;
  const t=e.touches[0];
  gestureStart(t.clientX,t.clientY,e.target,'touch');
  if(!g) return;
  window.addEventListener('touchmove',onTouchMove,{passive:false});
  window.addEventListener('touchend',onTouchEnd);
  window.addEventListener('touchcancel',onTouchEnd);
}
function onTouchMove(e){
  if(!g||g.src!=='touch') return;
  const t=e.touches[0];
  if(!t) return;
  gestureMove(t.clientX,t.clientY,e);
}
function onTouchEnd(e){
  window.removeEventListener('touchmove',onTouchMove);
  window.removeEventListener('touchend',onTouchEnd);
  window.removeEventListener('touchcancel',onTouchEnd);
  if(!g||g.src!=='touch') return;
  const t=(e.changedTouches&&e.changedTouches[0])||null;
  gestureEnd(t?t.clientX:g.x,t?t.clientY:g.y,e.type==='touchcancel');
}
document.addEventListener('touchstart',onTouchStart,{passive:true});

/* ---------- 鼠标 / 触控笔：pointer 事件 ---------- */
function onDown(e){
  if(e.pointerType==='touch') return;  // 触摸已由 touch 事件接管
  gestureStart(e.clientX,e.clientY,e.target,'pointer');
  if(!g) return;
  window.addEventListener('pointermove',onMove,{passive:false});
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onUp);
}
function onMove(e){
  if(!g||g.src!=='pointer') return;
  gestureMove(e.clientX,e.clientY,e);
}
function onUp(e){
  window.removeEventListener('pointermove',onMove);
  window.removeEventListener('pointerup',onUp);
  window.removeEventListener('pointercancel',onUp);
  if(!g||g.src!=='pointer') return;
  gestureEnd(e.clientX,e.clientY,e.type==='pointercancel');
}
document.addEventListener('pointerdown',onDown);
cardInner.addEventListener('click',e=>{
  if(e.target.closest('.starbtn')) return;
  if(lastMoved>TH.tapPx) return;
  flip();
});
document.addEventListener('click',e=>{
  const sb=e.target.closest('[data-star]');
  if(sb){toggleStar(sb.dataset.star);return;}
});

  store.groups.forEach(g=>{
    chips.push(`<button class="cchip ${ui.libGroup===g.id?'is-on':''}" data-lg="${g.id}">${esc(g.name)}</button>`);
  });
  el('libChips').innerHTML=chips.join('');

  const rows=cardsOf(ui.libGroup);
  if(ui.batch){
    el('libList').innerHTML=rows.length?rows.map(c=>`
      <div class="lrow">
        <button class="ckbox ${ui.sel.has(c.id)?'is-on':''}" data-sel="${c.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></button>
        <div class="lrow__b">
          <div class="lrow__f">${esc(c.front||'')}</div>
          <div class="lrow__k ${c.back?'':'is-empty'}">${esc(c.back||'—')}</div>
        </div>
      </div>`).join(''):`<div class="empty">暂无卡片</div>`;
  }else{
    el('libList').innerHTML=rows.length?rows.map(c=>{
      const names=cardGroupNames(c);
      const tags=names.length?names.map(n=>`<span class="gtag">${esc(n)}</span>`).join(''):`<span class="gtag is-none">未分组</span>`;
      return `<div class="lrow">
        <div class="lrow__b">
          <div class="lrow__f">${esc(c.front||'')}</div>
          <div class="lrow__k ${c.back?'':'is-empty'}">${esc(c.back||'—')}</div>
          <div class="lrow__g">${tags}</div>
        </div>
        <div class="lrow__act">
          <button class="${c.starred?'is-star':''}" data-star="${c.id}" aria-label="星标"><svg viewBox="0 0 24 24" fill="${c.starred?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.4l6-.8z"/></svg></button>
          <button data-edit="${c.id}" aria-label="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
          <button data-del="${c.id}" aria-label="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
        </div>
      </div>`;}).join(''):`<div class="empty">暂无卡片</div>`;
  }
  el('libTitle').textContent=ui.batch?`已选 ${ui.sel.size}`:'卡片库';
  el('libFoot').style.display=ui.batch?'none':'flex';
  el('batchBar').style.display=ui.batch?'flex':'none';
  if(ui.batch){
    el('batchBar').innerHTML=`
      <button class="btn btn--ghost" data-b="all">全选</button>
      <button class="btn btn--ghost" data-b="add">加入卡组</button>
      <button class="btn btn--ghost" data-b="remove">移出卡组</button>
      <button class="btn btn--danger" data-b="del">删除</button>
      <button class="btn btn--ghost" data-b="exit">退出</button>`;
  }
}

/* ================= modal ================= */
let modalOnClose=null;
function openModal(title,bodyHTML,buttons,onClose){
  el('modalTitle').textContent=title;
  el('modalBody').innerHTML=bodyHTML;
  el('modalFoot').innerHTML='';
  buttons.forEach(b=>{
    const btn=document.createElement('button');
    btn.className='btn '+(b.cls||'btn--ghost');
    btn.textContent=b.text;
    btn.style.flex=b.flex||'1';
    btn.onclick=()=>{ if(b.fn&&b.fn()===false) return; closeModal(); };
    el('modalFoot').appendChild(btn);
  });
  modalOnClose=onClose||null;
  el('modal').classList.add('show');
  el('scrim').classList.add('show');
  setTimeout(()=>{const f=el('modalBody').querySelector('input,textarea');if(f)f.focus();},60);
}
function closeModal(){
  el('modal').classList.remove('show');
  if(modalOnClose){const f=modalOnClose;modalOnClose=null;f();}
  if(!el('searchSheet').classList.contains('show')&&!el('deckMenu').classList.contains('show')) el('scrim').classList.remove('show');
}
el('modalBody').addEventListener('click',e=>{
  const ren=e.target.closest('[data-ren]');
  if(ren){renameGroup(ren.dataset.ren);return;}
  const dd=e.target.closest('[data-gdel]');
  if(dd){delGroup(dd.dataset.gdel);return;}
  const pk=e.target.closest('[data-pick]');
  if(pk){pk.classList.toggle('is-picked');return;}
});
el('modalClose').onclick=closeModal;
el('modal').addEventListener('click',e=>{if(e.target===el('modal'))closeModal()});

/* ================= card editor ================= */
function groupPicker(selected,idPrefix){
  const chips=store.groups.map(g=>`
    <button class="cchip ${selected.indexOf(g.id)>=0?'is-picked':''}" data-pick="${g.id}" data-pk="${idPrefix}">${esc(g.name)}</button>`).join('');
  return `<div class="pickrow" id="${idPrefix}">${chips||'<span class="dim">暂无卡组</span>'}</div>
    <input class="input" id="${idPrefix}New" placeholder="新建卡组" style="margin-bottom:12px">`;
}
function pickedGroups(prefix){
  const ids=[];
  document.querySelectorAll(`#${prefix} [data-pick].is-picked`).forEach(el=>ids.push(el.dataset.pick));
  return ids;
}
function editCard(cardId,presetGroups){
  const c=cardId?findCard(cardId):null;
  const isNew=!c;
  const cur=c||{id:uid(),front:'',back:'',groups:(presetGroups||[]).slice()};
  const sel=cur.groups||[];
  openModal(isNew?'新增卡片':'编辑卡片',`
    <div class="field"><label>正面</label><textarea class="input" id="edFront" rows="3" placeholder="正面">${esc(cur.front)}</textarea></div>
    <div class="field"><label>背面</label><textarea class="input" id="edBack" rows="5" placeholder="背面">${esc(cur.back)}</textarea></div>
    <div class="field"><label>卡组</label>${groupPicker(sel,'edGroups')}</div>
  `,[
    {text:'取消'},
    {text:'保存',cls:'btn--primary',fn:()=>{
      const front=el('edFront').value.trim();
      const back=el('edBack').value.trim();
      if(!front){toast('正面不能为空');return false;}
      const gs=pickedGroups('edGroups');
      const nn=el('edGroupsNew').value.trim();
      if(nn){
        const g={id:uid(),name:nn,updatedAt:now()};
        store.groups.push(g); gs.push(g.id);
      }
      if(isNew){
        store.cards.push({id:cur.id,front:front,back:back,starred:false,groups:gs,createdAt:now(),updatedAt:now()});
      }else{
        c.front=front;c.back=back;c.groups=gs;touchCard(c);
      }
      save();renderLib();renderStudy();
    }}
  ]);
}

/* ================= group manager ================= */
function manageGroups(){
  const rows=store.groups.map(g=>`
    <div class="deckrow">
      <span class="deckrow__n">${esc(g.name)}</span>
      <span class="deckrow__c">${groupCount(g.id)}</span>
      <button data-ren="${g.id}" aria-label="重命名"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
      <button data-gdel="${g.id}" aria-label="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
    </div>`).join('');
  openModal('管理卡组',`<div class="rows" style="border:0">${rows||'<div class="empty">暂无卡组</div>'}</div>`,[
    {text:'新建卡组',cls:'btn--primary',fn:()=>{setTimeout(newGroup,180);}},
    {text:'完成'}
  ]);
}
function newGroup(){
  openModal('新建卡组',`<div class="field"><label>名称</label><input class="input" id="ngName" placeholder="如：英语四级"></div>`,[
    {text:'取消'},
    {text:'创建',cls:'btn--primary',fn:()=>{
      const n=el('ngName').value.trim();
      if(!n){toast('名称不能为空');return false;}
      store.groups.push({id:uid(),name:n,updatedAt:now()});
      save();renderLib();renderStudy();toast('已创建');
    }}
  ]);
}
function renameGroup(id){
  const g=groupById(id);if(!g)return;
  openModal('重命名卡组',`<div class="field"><label>名称</label><input class="input" id="rgName" value="${esc(g.name)}"></div>`,[
    {text:'取消'},
    {text:'保存',cls:'btn--primary',fn:()=>{
      const n=el('rgName').value.trim();
      if(!n){toast('名称不能为空');return false;}
      g.name=n;touchGroup(g);save();renderLib();renderStudy();
      setTimeout(manageGroups,60);return false;
    }}
  ]);
}
function delGroup(id){
  const g=groupById(id);if(!g)return;
  const n=groupCount(id);
  openModal('删除卡组',`<p style="font-size:13.5px;color:var(--ink-2)">${esc(g.name)} · ${n} 张卡片将移出该卡组</p>`,[
    {text:'取消'},
    {text:'删除',cls:'btn--danger',fn:()=>{
      store.groups=store.groups.filter(x=>x.id!==id);
      if(store.settings.orders) delete store.settings.orders[id];
      store.cards.forEach(c=>{c.groups=c.groups.filter(x=>x!==id);touchCard(c);});
      if(ui.group===id){ui.group='all';ui.index=0;store.settings.group='all';}
      if(ui.libGroup===id) ui.libGroup='all';
      save();renderLib();renderStudy();toast('已删除');
      setTimeout(manageGroups,60);return false;
    }}
  ]);
}

/* ================= batch group ops ================= */
function batchGroups(mode){
  const selIds=[...ui.sel];
  const pre=mode==='add'?[]:[];
  openModal(mode==='add'?'加入卡组':'移出卡组',`
    ${groupPicker(pre,'bgGroups')}
    <input class="input" id="bgNew" placeholder="新建卡组">
  `,[
    {text:'取消'},
    {text:'确定',cls:'btn--primary',fn:()=>{
      const gs=pickedGroups('bgGroups');
      const nn=el('bgNew').value.trim();
      if(nn){const g={id:uid(),name:nn,updatedAt:now()};store.groups.push(g);gs.push(g.id);}
      if(!gs.length) return false;
      store.cards.forEach(c=>{
        if(!ui.sel.has(c.id)) return;
        if(mode==='add') gs.forEach(gid=>{if(c.groups.indexOf(gid)<0)c.groups.push(gid);});
        else c.groups=c.groups.filter(gid=>gs.indexOf(gid)<0);
        touchCard(c);
      });
      save();ui.sel.clear();renderLib();renderStudy();
    }}
  ]);
}

/* ================= import / export ================= */
function download(name,content,type){
  if(window.Android&&window.Android.saveFile){
    try{window.Android.saveFile(name,content,type||'application/json');toast('已保存到「下载」');return;}catch(e){}
  }
  const blob=new Blob([content],{type:type||'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},400);
}
function exportJson(){download('flashcards-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(store,null,2));toast('已导出 JSON')}
function exportTxt(){
  let out='';
  store.groups.forEach(g=>{
    const cs=store.cards.filter(c=>c.groups.indexOf(g.id)>=0);
    if(!cs.length) return;
    out+=`# ${g.name}\n`;
    cs.forEach(c=>{out+=`【正面】${c.front||''}\n【背面】${c.back||''}\n\n`;});
  });
  const none=store.cards.filter(c=>!c.groups.length);
  if(none.length){
    out+='# 未分组\n';
    none.forEach(c=>{out+=`【正面】${c.front||''}\n【背面】${c.back||''}\n\n`;});
  }
  download('flashcards-'+new Date().toISOString().slice(0,10)+'.txt',out,'text/plain;charset=utf-8');
  toast('已导出 TXT');
}
function mergeStore(local,remote){
  const out=JSON.parse(JSON.stringify(local));
  (remote.groups||[]).forEach(rg=>{
    const lg=out.groups.find(g=>g.id===rg.id);
    if(!lg){out.groups.push(JSON.parse(JSON.stringify(rg)));return;}
    if((rg.updatedAt||0)>(lg.updatedAt||0)){lg.name=rg.name;lg.updatedAt=rg.updatedAt;}
  });
  (remote.cards||[]).forEach(rc=>{
    const lc=out.cards.find(c=>c.id===rc.id);
    if(!lc){out.cards.push(JSON.parse(JSON.stringify(rc)));return;}
    if((rc.updatedAt||0)>(lc.updatedAt||0)){
      lc.front=rc.front;lc.back=rc.back;lc.starred=!!rc.starred;lc.groups=(rc.groups||[]).slice();lc.updatedAt=rc.updatedAt;
    }
  });
  return out;
}
function importJson(file){
  const r=new FileReader();
  r.onload=()=>{
    let data;
    try{data=JSON.parse(r.result);}catch(e){toast('文件格式错误');return;}
    let v2=null;
    if(data&&Array.isArray(data.cards)&&Array.isArray(data.groups)) v2=data;
    else if(data&&Array.isArray(data.decks)) v2=migrateV1(data);
    if(!v2){toast('文件格式错误');return;}
    openModal('导入',`<p style="font-size:13.5px;color:var(--ink-2)">${v2.cards.length} 张卡片 · ${v2.groups.length} 个卡组</p>`,[
      {text:'覆盖',cls:'btn--danger',fn:()=>{
        store.cards=v2.cards;store.groups=v2.groups;
        /* 覆盖导入时只恢复备份里的顺序；没有就退回默认顺序。
           主题、字号、WebDAV 等外观/设备设置仍然保留当前设备的。 */
        const o=v2.settings&&v2.settings.orders;
        store.settings.orders=(o&&typeof o==='object'&&!Array.isArray(o))?o:{};
        save();renderLib();renderStudy();toast('已覆盖导入');
      }},
      {text:'合并',cls:'btn--primary',fn:()=>{
        store=mergeStore(store,v2);
        save();renderLib();renderStudy();toast('已合并导入');
      }}
    ]);
  };
  r.readAsText(file);
}
el('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0];if(f)importJson(f);e.target.value='';
});

/* ================= webdav ================= */
function davAuth(){
  const w=store.settings.webdav||{};
  return 'Basic '+btoa(unescape(encodeURIComponent((w.user||'')+':'+(w.pass||''))));
}
function davBase(){return ((store.settings.webdav||{}).url||'').replace(/\/+$/,'')}
/* 目录按层级拆开再逐级 URL 编码 —— 中文目录名直接拼进 URL 会被服务端拒掉 */
function davDirParts(){
  const dir=((store.settings.webdav||{}).dir||'flashcards').replace(/^\/+|\/+$/g,'');
  return dir?dir.split('/').filter(Boolean):[];
}
function davDirUrl(){
  const parts=davDirParts();
  return parts.length?davBase()+'/'+parts.map(encodeURIComponent).join('/'):davBase();
}
function davFile(){return davDirUrl()+'/flashcards.json'}
/* 请求通道：网页环境直接用 fetch。
   在 Android 宿主（window.Android 存在）时改走原生 HTTP 桥，
   以绕开 WebView 对跨域 WebDAV 请求的 CORS 限制。
   纯网页环境 window.Android 为 undefined，行为与以前完全一致。 */
async function davFetch(url,opts){
  opts=opts||{};
  if(window.Android&&window.Android.davRequest){
    const raw=window.Android.davRequest(opts.method||'GET',url,JSON.stringify(opts.headers||{}),opts.body||null);
    const res=JSON.parse(raw);
    if(res.error) throw new Error(res.error);
    return {
      ok:res.status>=200&&res.status<300,
      status:res.status,
      json:()=>JSON.parse(res.body),
      text:()=>res.body
    };
  }
  return fetch(url,opts);
}
/* 把 HTTP 状态码翻译成人话。早期版本一律只显示「上传失败」，
   用户看到坚果云里没文件，却完全不知道是密码错、没权限还是目录不存在。 */
function davErrText(status,body){
  const map={
    400:'请求格式有误',
    401:'认证失败：账号或应用密码不对',
    403:'没有权限：应用密码可能没勾选「读写」权限',
    404:'路径不存在',
    405:'服务器不支持该操作',
    409:'父目录不存在',
    413:'文件太大',
    415:'服务器不接受该内容类型',
    423:'文件被锁定',
    429:'请求过于频繁，请稍后再试',
    507:'服务器空间不足'
  };
  const b=String(body||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,100);
  return (map[status]||('HTTP '+status))+(b?(' · '+b):'');
}
async function davText(r){try{return await r.text()}catch(e){return ''}}
/* 逐级创建目录。WebDAV 不会自动建父目录：直接 PUT 到不存在的目录下会 409，
   坚果云等主流服务都支持 MKCOL，所以这里自己把目录建出来。 */
async function davEnsureDir(){
  const parts=davDirParts();
  if(!parts.length) return true;
  const auth={Authorization:davAuth()};
  let path=davBase();
  for(const p of parts){
    path+='/'+encodeURIComponent(p);
    let r;
    try{r=await davFetch(path,{method:'MKCOL',headers:auth});}catch(e){return false;}
    /* 201=新建成功；405=目录已存在（部分服务器用 405 表示已存在）；
       409=父目录缺失 —— 这时才真的没戏了。403 不在此中断：
       有些服务不给 MKCOL 权限但允许直接 PUT，让 PUT 自己去报错更准。 */
    if(r.status===409) return false;
  }
  return true;
}
function davPathText(){return davBase()?davFile():'填好地址后显示'}
function setStatus(msg,bad){
  el('davStatus').innerHTML=`<div class="status ${bad?'is-bad':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${bad?'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>':'<path d="M20 6L9 17l-5-5"/>'}</svg><span>${esc(msg)}</span></div>`;
}
/* 同步互斥：连点两次「立即同步」会让两个请求交错，
   后完成的那个把前一个的状态提示盖掉，可能出现「明明失败了却显示已同步」。
   这里用一把锁保证同一时刻只有一次同步在跑。 */
let davBusy=false;
async function davTest(){
  if(davBusy){setStatus('正在同步，请稍候',true);return;}
  if(!davBase()){setStatus('未填写地址',true);return;}
  setStatus('连接中…');
  const auth={Authorization:davAuth()};
  try{
    let r=await davFetch(davBase(),{method:'OPTIONS',headers:auth});
    if(!r.ok&&r.status!==405){
      r=await davFetch(davBase(),{method:'PROPFIND',headers:Object.assign({},auth,{Depth:'0'})});
    }
    if(!r.ok&&r.status!==207){
      setStatus('连接失败 · '+davErrText(r.status,await davText(r)),true);return;
    }
    /* 连接通了不等于能写：再看一眼目标目录存不存在 */
    let note='连接正常';
    try{
      const p=await davFetch(davDirUrl(),{method:'PROPFIND',headers:Object.assign({},auth,{Depth:'0'})});
      if(p.status===404||p.status===409) note='连接正常，但目录还不存在（同步时会自动创建）';
    }catch(e){}
    setStatus(note);
  }catch(e){setStatus('连接失败 · '+(e&&e.message?e.message:'网络错误'),true);}
}
async function davSync(){
  if(davBusy){setStatus('正在同步，请稍候',true);return;}
  if(!davBase()){setStatus('未填写地址',true);return;}
  davBusy=true;
  setStatus('同步中…');
  try{
    const auth={Authorization:davAuth()};
    const file=davFile();

    /* ① 先读远端。404 = 还没有备份（正常）；401/403 = 认证/权限问题，必须报出来 */
    let remote=null;
    try{
      const r=await davFetch(file,{headers:auth});
      if(r.status===401||r.status===403){
        setStatus('读取失败 · '+davErrText(r.status,await davText(r)),true);return;
      }
      if(r.ok){try{remote=await r.json()}catch(e){}}
    }catch(e){}

    /* ② 合并 */
    if(remote&&(Array.isArray(remote.cards)||Array.isArray(remote.decks))){
      const v2=(Array.isArray(remote.cards)&&Array.isArray(remote.groups))?remote:migrateV1(remote);
      store=mergeStore(store,v2);
    }

    /* ③ 目录可能还不存在，先建出来 */
    if(!(await davEnsureDir())){
      setStatus('无法创建目录 '+davDirUrl()+'，请检查目录名，或在网盘里手动建好这个文件夹',true);return;
    }

    /* ④ 上传，并且**必须检查返回码**。
          以前这里直接丢掉返回值，服务器回 401/403/409 也照样显示「已同步」，
          用户以为存上了，其实坚果云里什么都没有。 */
    const r=await davFetch(file,{method:'PUT',headers:Object.assign({},auth,{'Content-Type':'application/json'}),body:JSON.stringify(store)});
    if(!r.ok){
      setStatus('上传失败 · '+davErrText(r.status,await davText(r)),true);return;
    }
    store.settings.lastSync=now();save();
    setStatus('已同步 · '+fmt(now()));
    renderLib();renderStudy();
  }catch(e){
    setStatus('同步失败 · '+(e&&e.message?e.message:'网络错误'),true);
  }finally{
    davBusy=false;
  }
}

/* ================= views ================= */
function show(view){
  ui.view=view;
  el('vStudy').classList.toggle('is-active',view==='study');
  el('vLibrary').classList.toggle('is-active',view==='library');
  el('vSettings').classList.toggle('is-active',view==='settings');
  window.scrollTo(0,0);
  if(view==='library') renderLib();
  if(view==='settings'){
    const w=store.settings.webdav||{};
    el('davUrl').value=w.url||'';el('davUser').value=w.user||'';el('davPass').value=w.pass||'';el('davDir').value=w.dir||'';
    el('davPath').textContent=davPathText();
    el('statCards').textContent=store.cards.length;
    el('statGroups').textContent=store.groups.length;
    if(store.settings.lastSync) setStatus('上次同步 '+fmt(store.settings.lastSync));
  }
}
/* 关闭最上层的浮层（弹窗 → 搜索面板 → 卡组菜单）。
   Android 宿主用它接管返回键：先关浮层，没有浮层可关时再退出应用。 */
function closeTopOverlay(){
  if(el('modal').classList.contains('show')){closeModal();return true;}
  if(el('searchSheet').classList.contains('show')){closeSearch();return true;}
  if(el('deckMenu').classList.contains('show')){closeDeckMenu();return true;}
  return false;
}

/* ================= events ================= */
el('deckChip').onclick=e=>{e.stopPropagation();openDeckMenu()};
el('btnShuffle').onclick=shuffleStudy;
el('btnResetOrder').onclick=resetStudyOrder;
el('btnLibrary').onclick=()=>{ui.libGroup=ui.group==='star'?'all':ui.group;ui.batch=false;ui.sel.clear();show('library')};
el('btnSettings').onclick=()=>show('settings');
el('libBack').onclick=()=>show('study');
el('setBack').onclick=()=>show('study');
el('scrim').onclick=()=>{closeDeckMenu();closeSearch();};
el('searchInput').addEventListener('input',renderSearch);
/* ✕ 关闭面板并清空查询：面板遮住了顶部的卡组按钮，
   必须有一个明确的「收起」入口，否则只能靠点遮罩关闭。 */
el('searchClose').onclick=()=>{
  el('searchInput').value='';renderSearch();closeSearch();
};
el('searchList').addEventListener('click',e=>{
  const row=e.target.closest('[data-jump]');if(!row)return;
  jumpToCard(row.dataset.jump);
});
el('libAdd').onclick=()=>{
  const preset=(ui.libGroup&&ui.libGroup!=='all'&&ui.libGroup!=='star')?[ui.libGroup]:[];
  editCard(null,preset);
};
el('libBatch').onclick=()=>{ui.batch=!ui.batch;ui.sel.clear();renderLib()};
el('btnImport').onclick=()=>el('fileInput').click();
el('btnExportJson').onclick=exportJson;
el('btnExportTxt').onclick=exportTxt;
el('btnManage').onclick=manageGroups;
el('setImport').onclick=()=>el('fileInput').click();
el('setExportJson').onclick=exportJson;
el('setExportTxt').onclick=exportTxt;
el('setClear').onclick=()=>{
  openModal('清空数据','<p style="font-size:13.5px;color:var(--ink-2)">将删除全部卡片与卡组（含示例卡片），无法撤销。外观与 WebDAV 设置会保留。</p>',
    [{text:'取消'},{text:'清空',cls:'btn--danger',fn:()=>{
      localStorage.removeItem(OLD_KEY);
      emptyContent();save();
      ui.group='all';ui.index=0;ui.flipped=false;ui.sel.clear();ui.batch=false;ui.libGroup='all';
      cardEl.classList.remove('is-flipped');
      renderStudy();renderLib();
      el('statCards').textContent=0;el('statGroups').textContent=0;
      toast('已清空');
    }}]);
};
el('davTest').onclick=davTest;
el('davSync').onclick=davSync;
['davUrl','davUser','davPass','davDir'].forEach(id=>{
  el(id).addEventListener('input',()=>{
    store.settings.webdav=store.settings.webdav||{};
    store.settings.webdav.url=el('davUrl').value.trim();
    store.settings.webdav.user=el('davUser').value;
    store.settings.webdav.pass=el('davPass').value;
    store.settings.webdav.dir=el('davDir').value.trim()||'flashcards';
    save();
    /* 目录一改，备份位置就变了 —— 立刻显示出来，用户才知道要去网盘哪里找 */
    el('davPath').textContent=davPathText();
  });
});
el('segTheme').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  store.settings.theme=b.dataset.v;save();applyTheme();
});
el('segFs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  store.settings.fs=b.dataset.v;save();applyTheme();
});
el('deckMenu').addEventListener('click',e=>{
  const g=e.target.closest('[data-g]');
  if(g){
    ui.group=g.dataset.g;ui.index=0;ui.flipped=false;
    store.settings.group=ui.group;save();
    cardEl.classList.remove('is-flipped');
    closeDeckMenu();renderStudy();return;
  }
  const a=e.target.closest('[data-act]');
  if(a){
    closeDeckMenu();
    if(a.dataset.act==='newgroup')setTimeout(newGroup,160);
    if(a.dataset.act==='manage')setTimeout(manageGroups,160);
    if(a.dataset.act==='clearstar'){
      const n=starCards().length;
      openModal('清空星标',`<p style="font-size:13.5px;color:var(--ink-2)">将取消 ${n} 张卡片的星标，卡片本身不会删除。</p>`,
        [{text:'取消'},{text:'清空星标',cls:'btn--danger',fn:()=>{
          starCards().forEach(c=>{c.starred=false;touchCard(c);});
          save();renderStudy();renderLib();toast('已清空星标');
        }}]);
    }
  }
});
el('libChips').addEventListener('click',e=>{
  const b=e.target.closest('[data-lg]');if(!b)return;
  ui.libGroup=b.dataset.lg;renderLib();
});
el('libList').addEventListener('click',e=>{
  const sel=e.target.closest('[data-sel]');
  if(sel){const id=sel.dataset.sel;ui.sel.has(id)?ui.sel.delete(id):ui.sel.add(id);renderLib();return;}
  const ed=e.target.closest('[data-edit]');
  if(ed){editCard(ed.dataset.edit);return;}
  const dl=e.target.closest('[data-del]');
  if(dl){delCard(dl.dataset.del);return;}
});
el('batchBar').addEventListener('click',e=>{
  const b=e.target.closest('[data-b]');if(!b)return;
  const act=b.dataset.b;
  if(act==='exit'){ui.batch=false;ui.sel.clear();renderLib();return;}
  if(act==='all'){
    const all=cardsOf(ui.libGroup).map(c=>c.id);
    if(ui.sel.size===all.length)ui.sel.clear();else all.forEach(id=>ui.sel.add(id));
    renderLib();return;
  }
  if(act==='add'||act==='remove'){batchGroups(act);return;}
  if(act==='del'){
    openModal('删除卡片',`<p style="font-size:13.5px;color:var(--ink-2)">${ui.sel.size} 张</p>`,[
      {text:'取消'},{text:'删除',cls:'btn--danger',fn:()=>{
        store.cards=store.cards.filter(c=>!ui.sel.has(c.id));
        save();ui.sel.clear();renderLib();renderStudy();
      }}]);
  }
});
function delCard(id){
  const c=findCard(id);if(!c)return;
  openModal('删除卡片',`<p style="font-size:13.5px;color:var(--ink-2)">${esc(c.front||'')}</p>`,[
    {text:'取消'},{text:'删除',cls:'btn--danger',fn:()=>{
      store.cards=store.cards.filter(x=>x.id!==id);
      save();renderLib();renderStudy();
    }}]);
}

document.addEventListener('keydown',e=>{
  if(e.target&&e.target.matches&&e.target.matches('input,textarea,select'))return;
  if(ui.view!=='study')return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}
  else if(e.key==='ArrowRight')goCard(1);
  else if(e.key==='ArrowLeft')goCard(-1);
  else if(e.key.toLowerCase()==='s')starCurrent();
  else if(e.key.toLowerCase()==='d')openSearch();
});

/* ================= init ================= */
store=load();
ui.group=store.settings.group||'all';
applyTheme();
renderStudy();
renderSearch();
if(!localStorage.getItem(HINT_KEY)){
  localStorage.setItem(HINT_KEY,'1');
  setTimeout(()=>{el('hint').classList.add('show');setTimeout(()=>el('hint').classList.remove('show'),3400)},700);
}
if(window.matchMedia){
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  const onChange=()=>{if(store.settings.theme==='auto')applyTheme()};
  if(mq.addEventListener)mq.addEventListener('change',onChange);
}
window.__fc={get store(){return store},get ui(){return ui},render:renderStudy,renderLib:renderLib,show:show};
window.Flashcards={view:()=>ui.view,home:()=>show('study'),back:()=>closeTopOverlay()};
})();
</script>
